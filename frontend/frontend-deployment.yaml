apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-app-frontend
  namespace: aks-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-app-frontend
  template:
    metadata:
      labels:
        app: aks-app-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/anjusah1510-coder/aks-app-frontend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: aks-app-frontend-service
  namespace: aks-app
spec:
  selector:
    app: aks-app-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP 