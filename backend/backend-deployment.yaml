apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-app-backend
  namespace: aks-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aks-app-backend
  template:
    metadata:
      labels:
        app: aks-app-backend 
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/anjusah1510-coder/aks-app-backend:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: aks-app-backend-service
  namespace: aks-app
spec:
  selector:
    app: aks-app-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP